<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NBA Poker · 可玩原型 PLAYABLE_v0.7（标准叫分 + AI 协作升级）</title>
<style>
  :root{
    --bg:#04060e; --ambient:radial-gradient(130% 80% at 50% -12%, rgba(10,132,255,.26), transparent 60%);
    --glass:rgba(255,255,255,.07); --glass-2:rgba(255,255,255,.12); --glass-bd:rgba(255,255,255,.16);
    --txt:#f5f5f7; --dim:rgba(245,245,247,.62);
    --accent:#0a84ff; --accent-2:#5ac8fa;
    --blue:#0a84ff; --blue2:#1b3a7a; --gold:#0a84ff; --gold2:#5ac8fa; --ink:#04121f;
    --court:#0a1428; --court2:#10203f; --panel:var(--glass); --line:var(--glass-bd);
    --radius:20px; --radius-sm:13px;
    --shadow:rgba(0,0,0,.22) 3px 5px 30px 0; --lift:0 18px 50px rgba(0,0,0,.55);
    --blur:saturate(180%) blur(22px);
    --font:-apple-system,"SF Pro Display","SF Pro Text",system-ui,"PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg) var(--ambient);
    color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);touch-action:manipulation;
    -webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  .topbar{width:100%;max-width:880px;display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:9px 14px;border:1px solid var(--glass-bd);border-radius:var(--radius);background:var(--glass);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.18);margin-bottom:8px}
  .topbar b{color:var(--accent);font-weight:700;letter-spacing:-.3px;font-size:15px}
  .pill{font-size:11px;color:var(--dim);text-align:right;flex:1}
  .mini{background:var(--glass-2);border:1px solid var(--glass-bd);color:var(--txt);padding:6px 12px;border-radius:980px;cursor:pointer;font-weight:600;flex:none;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .stage{width:100%;max-width:880px;flex:1;position:relative;border:1px solid var(--glass-bd);border-radius:var(--radius);
    background:linear-gradient(180deg,rgba(18,30,58,.45),rgba(6,10,20,.85));
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    overflow:hidden;padding:12px;min-height:520px;display:flex;flex-direction:column;gap:8px;
    box-shadow:var(--lift),inset 0 1px 0 rgba(255,255,255,.10)}
  .seats{display:flex;justify-content:space-between;gap:8px}
  .seat{flex:1;border:1px solid var(--glass-bd);border-radius:var(--radius-sm);padding:7px;background:var(--glass);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);min-height:58px;position:relative;
    box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s}
  .seat.active{border-color:rgba(10,132,255,.55);box-shadow:0 0 0 1px var(--accent) inset,0 0 18px rgba(10,132,255,.30)}
  .seat .nm{font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px}
  .seat .nm .seatAv{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent);flex-shrink:0}
  .seat .tag{font-size:10px;color:#fff;background:var(--accent);border-radius:7px;padding:1px 6px;font-weight:700}
  .seat .cnt{position:absolute;right:6px;top:6px;font-size:18px;color:var(--accent);font-weight:600}
  .seat .bubble{margin-top:4px;font-size:11px;color:var(--dim);min-height:14px}
  .seat .role{font-size:10px;color:var(--accent-2);font-weight:700}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px}
  .lastmove{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:46px;align-items:center}
  .phase{font-size:12px;color:var(--dim);text-align:center}
  .mult{color:var(--accent);font-size:15px;font-weight:600}
  .timer{font-size:22px;color:var(--accent-2);font-weight:600;letter-spacing:-.4px}
  .clock{font-size:13px;color:var(--dim)}
  .skill{font-size:12px;color:var(--accent);text-align:center;min-height:16px;font-weight:500}
  /* v0.7：手牌单行重叠展示（成熟斗地主习惯：一行铺开，左上角露点数） */
  .hand{display:flex;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:18px 8px 8px;border:1px solid var(--glass-bd);border-radius:var(--radius-sm);background:var(--glass);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);min-height:96px;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.10)}
  .card{width:clamp(38px,11vw,50px);height:clamp(54px,15.5vw,72px);border-radius:8px;background:linear-gradient(180deg,#ffffff,#eef0f5);border:1px solid #c9d2e6;position:relative;cursor:pointer;
    transition:transform .12s ease,box-shadow .15s ease;user-select:none;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .hand .card{margin-left:-18px}
  .hand .card:first-child{margin-left:0}
  .card:hover{transform:translateY(-4px)}
  .card.sel{transform:translateY(-14px);box-shadow:0 0 0 2px var(--accent),0 6px 14px rgba(0,0,0,.5);z-index:2}
  .card.phantom{border:2px solid var(--accent);background:linear-gradient(180deg,#e8f3ff,#cfe6ff);box-shadow:0 0 10px rgba(10,132,255,.5)}
  .card.wild{border:2px solid var(--accent);background:linear-gradient(180deg,#e8f3ff,#cfe6ff);box-shadow:0 0 10px rgba(10,132,255,.5)}
  .card.wild::after{content:"✷";position:absolute;top:1px;right:3px;font-size:13px;color:#043b6b;font-weight:800;line-height:1}
  .card.picked{outline:3px solid var(--accent-2);box-shadow:0 0 12px rgba(90,200,250,.75)}
  /* v0.7.4：乔丹万能牌点数选择器 */
  .wildPicker{display:none;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:8px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:rgba(10,132,255,.10);margin-top:6px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .wildPicker .wpTitle{width:100%;text-align:center;font-size:12px;color:var(--accent);font-weight:700}
  .wildPicker .wpRow{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:center}
  .wildPicker .wpLabel{font-size:12px;color:var(--txt);margin-right:2px}
  .wildPicker .wpRank{width:27px;height:27px;border-radius:980px;border:1px solid var(--glass-bd);background:var(--glass-2);color:var(--txt);font-size:12px;cursor:pointer;font-weight:700;padding:0;transition:transform .12s}

  .card .s{position:absolute;top:28px;left:6px;font-size:20px;color:#2c314d}

  .card.red .r,.card.red .s,.card.red .sc{color:#e23a4e}
  /* v0.7.3 纯文字渲染：大王/小王居中文字；幻影牌居中点数（尺寸由下方 .r/.s/.sc 控制，改字号即生效） */
  .card .jk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;line-height:1.05;color:#1c1c24;text-align:center}
  .card.red .jk{color:#e23a4e}
  .card .r2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#1a1d2e}
  .card.red .r2{color:#e23a4e}

  .card.back{background:linear-gradient(145deg,#2f6df0 0%,#1b3a7a 100%);border-color:rgba(255,255,255,.35);cursor:default;

  .btn.primary{background:var(--accent);color:#fff;border:none;box-shadow:0 6px 18px rgba(10,132,255,.38)}

  .skillTip .tipDesc{opacity:.92}
  .log{width:100%;max-width:880px;height:90px;overflow:auto;border:1px solid var(--glass-bd);border-radius:var(--radius-sm);background:var(--glass);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);padding:8px;font-size:12px;color:var(--dim);margin-top:8px;line-height:1.5;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.10)}
  .log .me{color:var(--accent)}
  .overlay{position:absolute;inset:0;background:rgba(4,8,16,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:20;padding:20px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

  .overlay h2{font-size:34px;color:var(--accent);font-weight:700;letter-spacing:-.5px}

  .ovCardImg{width:180px;height:auto;border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.6);border:2px solid var(--accent)}
  .overlay .hl{font-size:13px;color:var(--accent);margin-top:6px}
  .pill2{font-size:12px;color:var(--dim);max-width:80%}

  /* ===== 移动端适配（≤520px 手机竖屏）===== */

    body{padding:env(safe-area-inset-top) 6px env(safe-area-inset-bottom)}

    .topbar{padding:6px 8px;margin-bottom:6px}
    .pill{display:none}
    .seats{gap:5px}
    .seat{min-height:50px;padding:5px}
    .seat .nm{font-size:11px}
    .seat .cnt{font-size:15px}
    .center{min-height:96px;gap:4px}
    .card{width:clamp(34px,12.4vw,50px);height:clamp(48px,17vw,72px)}
    .hand{justify-content:flex-start;padding:16px 4px 10px}
    .hand .card{margin-left:-14px}
    .hand .card:first-child{margin-left:0}
    .controls{flex-direction:row;flex-wrap:wrap;gap:6px;padding:6px}
    .btn{flex:1 1 calc(50% - 6px);min-width:0;padding:13px 8px;font-size:14px}
    .btn.starPick{flex:1 1 44%;min-width:0;padding:10px 4px}
    .starPick .spImg{width:80px}
    .log{height:74px}
  }
  /* ===== 超窄屏（≤360px）进一步收紧 ===== */
  @media (max-width:360px){
    .seat .bubble{display:none}
  }
  /* ===== Phase 6 计时遥测面板（dev） ===== */
  .tele{position:fixed;right:8px;top:54px;width:min(320px,92vw);max-height:78vh;overflow:auto;

  .tele.on{display:block}
  .tele h3{font-size:13px;color:var(--accent);margin-bottom:6px}
  .tele .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--glass-bd)}
  .tele .row b{color:var(--txt)}
  .tele .acts{display:flex;gap:6px;margin-top:8px}
  .tele .acts button{flex:1;font-size:12px;padding:8px}
  .bottom{display:flex;gap:3px;justify-content:center;margin:4px 0;min-height:46px;align-items:center}
  .bottom .lbl{font-size:11px;color:var(--dim);margin-right:4px}
  .bottom .card{width:30px;height:42px;font-size:12px;margin-left:0!important}
  .bottom .card .r{font-size:20px;top:2px;left:3px}
  .bottom .card .s{font-size:17px;top:21px;left:4px}
  .bottom .card .sc{font-size:19px;bottom:2px;right:3px}
  .bottom .card .jk{font-size:11px}
  .bottom .card .r2{font-size:15px}
  .bottom .card.back::after{font-size:12px}
  .ovStats{display:none;width:100%;max-width:340px;margin:6px auto 0;font-size:13px;text-align:left;background:rgba(255,255,255,.06);border:1px solid var(--glass-bd);border-radius:var(--radius-sm);padding:10px 12px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
  .ovStats h4{margin:0 0 6px;font-size:13px;color:var(--accent)}

  .ovStats .srow .win{color:#5be38a}
  .ovStats .srow .lose{color:#ff8a8a}
</style>

<script>
/* ============ 牌模型 ============ */
const SUITS=["♠","♥","♣","♦"];
const RED={"♥":1,"♦":1};
const LABEL={3:"3",4:"4",5:"5",6:"6",7:"7",8:"8",9:"9",10:"10",11:"J",12:"Q",13:"K",14:"A",15:"2",16:"小王",17:"大王"};
let CARD_SEQ=0;
function buildDeck(){
  const d=[];
  for(let v=3;v<=15;v++) for(const s of SUITS) d.push({id:++CARD_SEQ,v,s,red:!!RED[s],label:LABEL[v]});
  d.push({id:++CARD_SEQ,v:16,s:"",red:false,label:"小王"});
  d.push({id:++CARD_SEQ,v:17,s:"",red:true,label:"大王"});
  return d;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 手牌排序（成熟斗地主习惯）：大王>小王>2>A>K>…>3，同点花色分组
const SUIT_ORDER={"♠":3,"♥":2,"♣":1,"♦":0};
function sortHand(h){ h.sort((a,b)=> b.v-a.v || ((SUIT_ORDER[b.s]??-1)-(SUIT_ORDER[a.s]??-1))); }
function anyBomb(hand){ const g=groupByVal(hand); return (g[16]&&g[17]) || Object.values(g).some(a=>a.length===4); }
// 发牌 + N4 极端坏牌兜底重发 + 保底炸弹回调
function dealHands(){
  const wantBomb=Math.random()<GUARANTEE_BOMB_PROB;
  let best=null,bestStr=-Infinity,attempts=0;
  while(attempts<60){
    attempts++;
    const deck=shuffle(buildDeck());
    const p0=deck.slice(0,17),p1=deck.slice(17,34),p2=deck.slice(34,51),bottom=deck.slice(51,54);
    const str=handStrength(p0);
    // 保底炸弹（DEC-013）：只保证【人类手牌 p0】含炸弹，直接回应"玩家抽到炸弹概率小"。
    // p=0.22 时人类起手炸弹率 ≈ 0.22 + 0.78×自然率20% ≈ 37%，落在 35%-40% 目标区间；
    // naive 基线已改为无技能叫分（DEC-012），留出足够 M-07 余量吸收此回调。
    const hasBomb=anyBomb(p0);
    if((!wantBomb||hasBomb) && str>bestStr){ bestStr=str; best={p0,p1,p2,bottom,hasBomb}; }
    if(best && str>=BAD_HAND_FLOOR && (!wantBomb||best.hasBomb)) break;
  }
  if(!best){ const deck=shuffle(buildDeck()); best={p0:deck.slice(0,17),p1:deck.slice(17,34),p2:deck.slice(34,51),bottom:deck.slice(51,54),hasBomb:false}; }
  return best;
}

/* ============ 手牌强度评估（N4 兜底依据） ============ */
function handStrength(hand){
  const g=groupByVal(hand); let s=0;
  if(g[17])s+=6;
  if(g[16])s+=3;
  if(g[15])s+=g[15].length*2.2;
  Object.values(g).forEach(a=>{ if(a.length===4) s+=5; });
  [14,13,12,11].forEach(v=>{ if(g[v]) s+=g[v].length*(v-10)*0.4; });
  const vals=Object.keys(g).map(Number).sort((a,b)=>a-b);
  let run=1,maxrun=1; for(let i=1;i<vals.length;i++){ if(vals[i]===vals[i-1]+1){run++;maxrun=Math.max(maxrun,run);}else run=1; }
  if(maxrun>=5) s+=(maxrun-4)*1.2;
  return s;
}
function countBombs(hand){
  const g=groupByVal(hand); let n=0;
  if(g[16]&&g[17]) n++;
  Object.values(g).forEach(a=>{ if(a.length===4) n++; });
  return n;
}

/* ============ 牌型解析 ============ */
function isConsec(arr){for(let i=1;i<arr.length;i++) if(arr[i]!==arr[i-1]+1) return false; return true;}
function findConsecRun(sorted,m){
  for(let i=0;i+m-1<sorted.length;i++){
    let ok=true; for(let j=0;j<m;j++) if(sorted[i+j]!==sorted[i]+j){ok=false;break;}
    if(ok) return sorted.slice(i,i+m);
  }
  return null;
}
function parseMove(cards){
  if(!cards||cards.length===0) return null;
  const vals=cards.map(c=>c.v).sort((a,b)=>a-b);
  const n=vals.length;
  const counts={}; vals.forEach(v=>counts[v]=(counts[v]||0)+1);
  const ranks=Object.keys(counts).map(Number).sort((a,b)=>a-b);
  if(n===2 && counts[16] && counts[17]) return {type:"rocket",rank:100,len:1,cards};
  if(n===4 && ranks.length===1) return {type:"bomb",rank:ranks[0],len:1,cards};
  if(n===1) return {type:"single",rank:vals[0],len:1,cards};
  if(n===2 && ranks.length===1) return {type:"pair",rank:ranks[0],len:1,cards};
  if(n===3 && ranks.length===1) return {type:"triple",rank:ranks[0],len:1,cards};
  if(n===4){const t=ranks.find(r=>counts[r]===3); if(t!==undefined) return {type:"triple1",rank:t,len:1,cards}; return null;}
  if(n===5){const t=ranks.find(r=>counts[r]===3),p=ranks.find(r=>counts[r]===2);
    if(t!==undefined&&p!==undefined&&t!==p) return {type:"triple2",rank:t,len:1,cards};}
  if(n>=5 && ranks.length===n && isConsec(ranks) && ranks[ranks.length-1]<=14)
    return {type:"straight",rank:ranks[ranks.length-1],len:n,cards};
  if(n>=6 && n%2===0 && ranks.length===n/2 && ranks.every(r=>counts[r]===2) && isConsec(ranks) && ranks[ranks.length-1]<=14)
    return {type:"double",rank:ranks[ranks.length-1],len:n/2,cards};
  const tripleRanks=ranks.filter(r=>counts[r]>=3 && r<=14).sort((a,b)=>a-b);
  if(n%3===0){const m=n/3; if(tripleRanks.length===m && isConsec(tripleRanks) && ranks.every(r=>counts[r]===3))
    return {type:"airplane",rank:tripleRanks[m-1],len:m,cards};}
  if(n%4===0){const m=n/4; const run=findConsecRun(tripleRanks,m);
    if(run){const used={};run.forEach(r=>used[r]=3);let rem=0;vals.forEach(v=>{if(used[v]>0)used[v]--;else rem++;});
      if(rem===m) return {type:"airplane1",rank:run[m-1],len:m,cards};}}
  if(n%5===0){const m=n/5; const run=findConsecRun(tripleRanks,m);
    if(run){const used={};run.forEach(r=>used[r]=3);const rv=[];vals.forEach(v=>{if(used[v]>0)used[v]--;else rv.push(v);});
      if(rv.length===2*m){const rc={};rv.forEach(v=>rc[v]=(rc[v]||0)+1);if(Object.values(rc).every(c=>c===2))return {type:"airplane2",rank:run[m-1],len:m,cards};}}}
  return null;
}
function beats(prev,mv){
  if(!prev) return true;
  if(mv.type==="rocket") return true;
  if(mv.type==="bomb"){ if(prev.type==="rocket")return false; if(prev.type==="bomb")return mv.rank>prev.rank; return true; }
  if(prev.type==="bomb"||prev.type==="rocket") return false;
  return mv.type===prev.type && mv.len===prev.len && mv.rank>prev.rank;
}

/* ============ 乔丹·神之一手：万能牌 human-aware 解析 ============ */
// 给定物理牌（可能含万能牌）与「每张万能牌→代表点数」映射，返回带替点 rank 的走法。
// 返回的 mv.cards 仍是原始物理牌引用，仅 mv.rank 为替点后数值——与引擎 AI 路径保持一致，
// 这样 applyMove 按 id 正确移除、beats 按 mv.rank 判定。
function parseMoveWithWild(cards, wildMap){
  if(!cards||!cards.length) return null;
  const tmp=cards.map(c=> (wildMap[c.id]!==undefined)?{...c,v:wildMap[c.id]}:c);
  const mv=parseMove(tmp);
  if(!mv) return null;
  mv.cards=mv.cards.map(mc=>cards.find(x=>x.id===mc.id));
  return mv;
}
// 万能牌入选手牌时的默认代表点数：取其余非万能牌中出现最多的点数，否则 2(=15)
function defaultWildRank(forId){
  const others=[...selected].filter(id=>id!==forId && !(G.ss[0]&&G.ss[0].wildIds.includes(id)));
  if(others.length){
    const cnt={}; others.forEach(id=>{ const c=G.players[0].hand.find(x=>x.id===id); if(c&&c.v<=15) cnt[c.v]=(cnt[c.v]||0)+1; });
    let best=15,bestN=0; Object.keys(cnt).map(Number).forEach(v=>{ if(cnt[v]>bestN){bestN=cnt[v];best=v;} });
    if(bestN>0) return best;
  }
  return 15;
}
// 清理 wildChoice：仅保留「仍在选中且仍是万能牌」的条目

/* ============ 走子生成 ============ */
function groupByVal(hand){const g={};hand.forEach(c=>(g[c.v]=g[c.v]||[]).push(c));return g;}
function genAllMoves(hand){
  const moves=[];const g=groupByVal(hand);const vals=Object.keys(g).map(Number).sort((a,b)=>a-b);
  vals.forEach(v=>moves.push({type:"single",rank:v,len:1,cards:[g[v][0]]}));
  vals.forEach(v=>{if(g[v].length>=2)moves.push({type:"pair",rank:v,len:1,cards:g[v].slice(0,2)});});
  vals.forEach(v=>{if(g[v].length>=3){
    moves.push({type:"triple",rank:v,len:1,cards:g[v].slice(0,3)});
    const other=vals.find(o=>o!==v&&g[o].length>=1); if(other!==undefined)
      moves.push({type:"triple1",rank:v,len:1,cards:g[v].slice(0,3).concat(g[other][0])});
    const op=vals.find(o=>o!==v&&g[o].length>=2); if(op!==undefined)
      moves.push({type:"triple2",rank:v,len:1,cards:g[v].slice(0,3).concat(g[op].slice(0,2))});
  }});
  vals.forEach(v=>{if(g[v].length===4)moves.push({type:"bomb",rank:v,len:1,cards:g[v].slice(0,4)});});
  if(g[16]&&g[17]) moves.push({type:"rocket",rank:100,len:1,cards:[g[16][0],g[17][0]]});
  for(let len=5;len<=12;len++) for(let s=3;s+len-1<=14;s++){
    let ok=true;const cs=[];for(let k=0;k<len;k++){if(!g[s+k]){ok=false;break;}cs.push(g[s+k][0]);}
    if(ok) moves.push({type:"straight",rank:s+len-1,len,cards:cs});
  }
  for(let len=3;len<=10;len++) for(let s=3;s+len-1<=14;s++){
    let ok=true;const cs=[];for(let k=0;k<len;k++){if(!g[s+k]||g[s+k].length<2){ok=false;break;}cs.push(g[s+k][0],g[s+k][1]);}
    if(ok) moves.push({type:"double",rank:s+len-1,len,cards:cs});
  }
  return moves;
}
function genBeating(hand,prev){
  if(prev.type==="rocket") return [];
  const out=[];const g=groupByVal(hand);const vals=Object.keys(g).map(Number).sort((a,b)=>a-b);
  if(prev.type==="single"){vals.forEach(v=>{if(v>prev.rank)out.push({type:"single",rank:v,len:1,cards:[g[v][0]]});});}
  else if(prev.type==="pair"){vals.forEach(v=>{if(v>prev.rank&&g[v].length>=2)out.push({type:"pair",rank:v,len:1,cards:g[v].slice(0,2)});});}
  else if(prev.type==="triple"){vals.forEach(v=>{if(v>prev.rank&&g[v].length>=3)out.push({type:"triple",rank:v,len:1,cards:g[v].slice(0,3)});});}
  else if(prev.type==="triple1"){vals.forEach(v=>{if(v>prev.rank&&g[v].length>=3){const o=vals.find(x=>x!==v&&g[x].length>=1);if(o!==undefined)out.push({type:"triple1",rank:v,len:1,cards:g[v].slice(0,3).concat(g[o][0])});}});}
  else if(prev.type==="triple2"){vals.forEach(v=>{if(v>prev.rank&&g[v].length>=3){const o=vals.find(x=>x!==v&&g[x].length>=2);if(o!==undefined)out.push({type:"triple2",rank:v,len:1,cards:g[v].slice(0,3).concat(g[o].slice(0,2))});}});}
  else if(prev.type==="straight"){for(let s=3;s+prev.len-1<=14;s++){if(s+prev.len-1<=prev.rank)continue;let ok=true;const cs=[];for(let k=0;k<prev.len;k++){if(!g[s+k]){ok=false;break;}cs.push(g[s+k][0]);}if(ok)out.push({type:"straight",rank:s+prev.len-1,len:prev.len,cards:cs});}}
  else if(prev.type==="double"){for(let s=3;s+prev.len-1<=14;s++){if(s+prev.len-1<=prev.rank)continue;let ok=true;const cs=[];for(let k=0;k<prev.len;k++){if(!g[s+k]||g[s+k].length<2){ok=false;break;}cs.push(g[s+k][0],g[s+k][1]);}if(ok)out.push({type:"double",rank:s+prev.len-1,len:prev.len,cards:cs});}}
  else if(prev.type==="airplane"||prev.type==="airplane1"||prev.type==="airplane2"){/* AI 简化：略过飞机跟牌 */}
  vals.forEach(v=>{if(g[v].length===4)out.push({type:"bomb",rank:v,len:1,cards:g[v].slice(0,4)});});
  if(g[16]&&g[17]) out.push({type:"rocket",rank:100,len:1,cards:[g[16][0],g[17][0]]});
  return out;
}

/* ============ AI 策略 v0.7（记牌 + 手数评估 + 农民 2打1 协作） ============
 * bug ⑧ 升级：SEEN 记牌器 / minTricks 贪心拆手 / 残局压制 / 炸弹时机
 * bug ④ 修复：任何农民 AI 都与"另一个农民"协作（队友是真人或 AI 均生效），
 *            农民永不内讧；Phase 4 削弱旋钮只作用于"与真人为敌"的座位。 */

/* ---- 记牌器：全场已打出的牌（v → 已出张数） ---- */
const SEEN={};
function seenReset(){ for(const k in SEEN) delete SEEN[k]; }
function seenAdd(cards){ cards.forEach(c=>{ SEEN[c.v]=(SEEN[c.v]||0)+1; }); }
function isTopRemaining(v,myHand){   // 除我手牌与已打出的牌，场上是否已无更大的单张
  for(let x=v+1;x<=17;x++){
    const total=(x>=16)?1:4;
    const mine=myHand.reduce((n,c)=>n+(c.v===x?1:0),0);
    if(total-(SEEN[x]||0)-mine>0) return false;
  }
  return true;
}
/* ---- 贪心拆手数：火箭/炸弹→顺子→连对→三带→对/单 ---- */
function minTricks(hand){
  const cnt={}; hand.forEach(c=>{ cnt[c.v]=(cnt[c.v]||0)+1; });
  let tricks=0;
  if(cnt[16]&&cnt[17]){ tricks++; delete cnt[16]; delete cnt[17]; }
  else { if(cnt[16]){tricks++;delete cnt[16];} if(cnt[17]){tricks++;delete cnt[17];} }
  for(const v of Object.keys(cnt)) if(cnt[v]===4){ tricks++; delete cnt[v]; }
  let found=true;
  while(found){ found=false;                       // 顺子 ≥5
    for(let s=3;s<=10;s++){ let len=0; while(s+len<=14&&cnt[s+len]>0) len++;
      if(len>=5){ for(let k=0;k<len;k++){ cnt[s+k]--; if(!cnt[s+k]) delete cnt[s+k]; } tricks++; found=true; break; } } }
  found=true;
  while(found){ found=false;                       // 连对 ≥3
    for(let s=3;s<=12;s++){ let len=0; while(s+len<=14&&cnt[s+len]>=2) len++;
      if(len>=3){ for(let k=0;k<len;k++){ cnt[s+k]-=2; if(!cnt[s+k]) delete cnt[s+k]; } tricks++; found=true; break; } } }
  let triples=0,pairs=0,singles=0;
  for(const v of Object.keys(cnt)){
    let n=cnt[v];
    if(n>=3){ triples++; n-=3; }
    if(n===2) pairs++; else if(n===1) singles++;
  }
  let t=triples;
  while(t>0&&(pairs>0||singles>0)){ if(singles>0) singles--; else pairs--; t--; tricks++; }  // 三带吸收散牌
  return tricks+t+pairs+singles;
}
/* ---- 候选择优：打出后剩余手数最少（平手取更小牌点） ---- */
function pickByTricks(hand,cands){
  if(!cands.length) return null;
  let best=null,bestT=1e9;
  const lim=Math.min(cands.length,24);
  for(let i=0;i<lim;i++){
    const m=cands[i];
    const ids=new Set(m.cards.map(c=>c.id));
    const t=minTricks(hand.filter(c=>!ids.has(c.id)));
    if(t<bestT||(t===bestT&&best&&m.rank<best.rank)){ bestT=t; best=m; }
  }
  return best||cands[0];
}

// 真人（seat 0）为实控玩家，永远走强策略；平衡削弱只在 AI 座（1/2）生效
function aiChoose(seat,prev){
  if(seat===0) return aiStrong(seat,prev);
  const landlord=G.landlord;
  const seatFarmer=(seat!==landlord);
  const partner=seatFarmer?[0,1,2].find(s=>s!==seat&&s!==landlord):-1;  // 另一个农民（真人或 AI）
  const coop=BAL.COOP && seatFarmer;
  // 与真人为敌才吃削弱：真人是地主 → 两个 AI 农民都是对手；真人是农民 → AI 地主是对手
  const vsHuman=(landlord===0)?seatFarmer:(seat===landlord);
  const hand=G.players[seat].hand;
  const oppSeats=seatFarmer?[landlord]:[0,1,2].filter(s=>s!==seat);
  const minOpp=Math.min(...oppSeats.map(s=>G.players[s].hand.length));

  if(!prev){ /* ---- 领出 ---- */
    const all=genAllForSeat(seat);
    const nonBomb=all.filter(m=>m.type!=="bomb"&&m.type!=="rocket");
    if(!nonBomb.length) return all.sort((a,b)=>a.rank-b.rank)[0];
    // 协作①：队友只剩 1/2 张 → 喂对应牌型的最小牌送队友走
    if(coop && partner>=0 && G.players[partner].hand.length<=2){
      const need=G.players[partner].hand.length;
      const feed=nonBomb.filter(m=>(need===2&&m.type==="pair")||m.type==="single").sort((a,b)=>a.rank-b.rank)[0];
      if(feed) return feed;
    }
    // 协作②：真人队友且真人牌少 → 甩最小单牌让节奏（保留 v0.6 体验）
    if(coop && partner===0 && G.players[0].hand.length<=hand.length){
      const singles=nonBomb.filter(m=>m.type==="single").sort((a,b)=>a.rank-b.rank);
      if(singles.length) return singles[0];
    }
    // 残局压制：对手 ≤2 张 → 不送小单张（改出对/三/高张）
    if(minOpp<=2){
      const safe=nonBomb.filter(m=>!(m.type==="single"&&m.rank<14&&!isTopRemaining(m.rank,hand)));
      if(safe.length) return pickByTricks(hand,safe.sort((a,b)=>a.rank-b.rank));
      const bomb=all.find(m=>m.type==="bomb"||m.type==="rocket");
      if(bomb) return bomb;
    }
    // 平衡削弱：对手座位领出 40% 走次优
    if(vsHuman && Math.random()<BAL.LEAD_SUBOPT){
      const sorted=nonBomb.slice().sort((a,b)=>a.rank-b.rank||a.cards.length-b.cards.length);
      return sorted[Math.min(2,sorted.length-1)];
    }
    return pickByTricks(hand,nonBomb.sort((a,b)=>a.rank-b.rank));   // 手数最优领出
  } else { /* ---- 跟牌 ---- */
    const bl=genBeatingForSeat(seat,prev);
    const nonBomb=bl.filter(m=>m.type!=="bomb"&&m.type!=="rocket");
    // 协作③：队友（另一个农民）正领出 → 自主判断：默认让牌，但"顺手出牌"可压队友
    if(coop && G.lastSeat===partner){
      const canFinish=nonBomb.find(m=>hand.length-m.cards.length===0);
      if(canFinish) return canFinish;                       // 一手走完，当然压
      if((partner+1)%3===landlord && G.passes>=1) return null; // 地主已让过，队友必得牌权 → 让牌
      const play=coopMaybeBeatFarmer(seat,prev,nonBomb,hand,partner);
      if(play) return play;                                 // 顺手出牌 / 护牌权：压队友
      return null;                                          // 否则让牌
    }
    // 协作④：真人队友牌更少 → 让真人打（除非能一手走完）
    if(coop && partner===0 && G.players[0].hand.length<=hand.length){
      const canFinish=nonBomb.some(m=>hand.length-m.cards.length===0);
      if(!canFinish && G.lastSeat!==landlord) return null;
    }
    if(nonBomb.length){
      if(vsHuman && Math.random()<BAL.PASS_GIVE) return null;   // 平衡削弱：12% 送节奏
      nonBomb.sort((a,b)=>a.cards.length-b.cards.length||a.rank-b.rank);
      // 残局：对手 ≤2 张时用大牌压死，不给翻身机会
      if(minOpp<=2 && (prev.type==="single"||prev.type==="pair")) return nonBomb[nonBomb.length-1];
      return nonBomb[0];
    }
    // 炸弹时机：对手将走完 / 炸完自己 ≤2 手 / 手牌见底
    const bomb=bl.find(m=>m.type==="bomb"||m.type==="rocket");
    if(bomb){
      const oppAboutToWin=(G.lastSeat>=0 && oppSeats.includes(G.lastSeat) && G.players[G.lastSeat].hand.length<=2);
      const after=hand.filter(c=>!bomb.cards.some(x=>x.id===c.id));
      if(oppAboutToWin || minTricks(after)<=2 || hand.length<=BAL.BOMB_THR) return bomb;
    }
    return null;
  }
}
// 农民自主性：队友领出时，是否"顺手"压队友把自家想出的牌打掉（不浪费 2/王/炸弹，不白送牌权给地主）
function coopMaybeBeatFarmer(seat,prev,nonBomb,hand,partner){
  const landlord=G.landlord;
  if(partner===0) return null;   // 不压真人农民的领出：既礼貌、又消除"naive 真人更常当农民→被 AI 顺手出牌帮到"的测量不对称
  const g=groupByVal(hand);
  const bombVals=Object.keys(g).map(Number).filter(v=>g[v].length===4);
  const cands=nonBomb.filter(m=>
    m.type!=="bomb" && m.type!=="rocket" &&
    !m.cards.some(c=>c.v>=15) &&                  // 不拿 2/王压队友
    !m.cards.some(c=>bombVals.includes(c.v))      // 不拆自己的炸弹
  ).sort((a,b)=>a.rank-b.rank || a.cards.length-b.cards.length);
  if(!cands.length) return null;
  const nextSeat=(seat+1)%3;
  // 护牌权：地主在我下家、队友打小牌 → 用中张(10-14)顶，避免牌权落地主
  if(nextSeat===landlord && (prev.type==="single"||prev.type==="pair") && prev.rank<12){
    const mid=cands.find(m=>m.rank>=10&&m.rank<=14);
    if(mid) return mid;
  }
  // 顺手出牌：下家是队友 → 压了牌权落回队友，可放心甩自家可舍弃的牌
  if(nextSeat===partner) return cands[0];
  return null;                                      // 下家是地主且非护牌权 → 让牌（不白送牌权）
}
// 真人的强策略（熟练玩家代理，不被平衡削弱；v0.7 同步升级：手数评估 + 残局压制）
function aiStrong(seat,prev){
  const hand=G.players[seat].hand;
  const opp=[0,1,2].filter(s=>s!==seat && (seat===G.landlord?true:s===G.landlord));
  const minOpp=opp.length?Math.min(...opp.map(s=>G.players[s].hand.length)):20;
  if(!prev){
    const all=genAllMoves(hand);
    const nonBomb=all.filter(m=>m.type!=="bomb"&&m.type!=="rocket");
    if(nonBomb.length){
      // 对手快走完 → 不送小单张
      if(minOpp<=2){
        const safe=nonBomb.filter(m=>!(m.type==="single"&&m.rank<14&&!isTopRemaining(m.rank,hand)));
        if(safe.length) return pickByTricks(hand,safe.sort((a,b)=>a.rank-b.rank));
      }
      return pickByTricks(hand,nonBomb.sort((a,b)=>a.rank-b.rank));   // 手数最优领出
    }
    return all.sort((a,b)=>a.rank-b.rank)[0];
  } else {
    const beatsL=genBeating(hand,prev);
    const nonBomb=beatsL.filter(m=>m.type!=="bomb"&&m.type!=="rocket");
    if(hand.length<=2){const bomb=beatsL.find(m=>m.type==="bomb"||m.type==="rocket");if(bomb)return bomb;}
    if(nonBomb.length){
      nonBomb.sort((a,b)=>a.cards.length-b.cards.length||a.rank-b.rank);
      if(minOpp<=2 && (prev.type==="single"||prev.type==="pair")) return nonBomb[nonBomb.length-1];  // 残局压死
      return nonBomb[0];
    }
    const bomb=beatsL.find(m=>m.type==="bomb"||m.type==="rocket");
    if(bomb){
      const after=hand.filter(c=>!bomb.cards.some(x=>x.id===c.id));
      if(hand.length<=5 || minTricks(after)<=2 || minOpp<=2) return bomb;
    }
    return null;
  }
}
function aiBid(hand){
  const g=groupByVal(hand);let s=0;
  if(g[17])s+=2; if(g[16])s+=1; if(g[15])s+=g[15].length*0.8;
  Object.values(g).forEach(arr=>{if(arr.length===4)s+=2;});
  s+=hand.length*0.05;
  if(s>=6)return 3; if(s>=3.5)return 2; if(s>=2)return 1; return 0;
}
function aiDouble(seat){ return Math.random()<0.45; }

/* ---- v0.7 标准叫分制（参照 QQ 斗地主经典规则）----
 * 随机起叫，按位轮流叫 0/1/2/3 分；只能叫比当前更高的分；
 * 叫 3 分立即成为地主（后位不再表态）；三家都不叫 → 重新发牌。
 * 底分 = 最高叫分；炸弹/火箭与加倍在此基础上 ×2。
 * （v0.6 的"抢地主"阶段废除：renderControls_rob 未定义导致真人路径必崩，
 *   这就是"AI 叫分后玩家无响应/卡死"的根因。）*/
function stepBid(){
  if(G.bidRound.length>=3){ afterBid(); return; }
  const seat=G.turn;
  setPhaseTxt("叫地主（"+(G.bidRound.length+1)+"/3）· 当前最高："+(G.bidMax>0?G.bidMax+" 分（"+G.players[G.bidWinner].name+"）":"无人叫分"));
  if(seat===0){
    renderControls_bid();
    startCountdown(BID_SECONDS, ()=>doBid(0,0));
  } else {
    setBubble(seat, "思考中…");
    G.aiTimer=setTimeout(()=>{ const b=aiBid(G.players[seat].hand); doBid(seat, b>G.bidMax?b:0); },700);
  }
}
function doBid(seat,b){
  if(b>0 && b<=G.bidMax) b=0;                  // 防御：低于当前最高分的叫分一律按不叫处理
  G.bidRound.push({seat,b});
  if(b>0){ G.bidMax=b; G.bidWinner=seat; setBubble(seat,"叫 "+b+" 分"); }
  else setBubble(seat,"不叫");
  log(`${G.players[seat].name} ${b>0?("叫 "+b+" 分"):"不叫"}`);
  renderAll();
  if(b===3){ afterBid(); return; }             // 叫 3 分立即定地主（标准规则）
  if(G.bidRound.length>=3){ afterBid(); return; }
  G.turn=(G.turn+1)%3; stepBid();
}
function afterBid(){
  clearTimers();
  if(G.bidWinner===-1){
    log("三家都不叫，重新发牌。");

function autoPlaySeat(seat, prev){

function humanUseSkill(){
  const seat=0, st=G.star[0], S=G.ss[0], hand=G.players[0].hand, prev=G.lastMove;
  if(st==='curry' && S.curryUsed<2){ const t=curryReorgMove(0); if(t){ S.curryUsed++; log(`🏀 ${G.players[0].name}·百步穿杨：重组三连`,true); commitMove(0,t); return; } }
  if(st==='alexander'){ const t=Object.keys(S.foul).find(k=>(S.foul[k]||0)>=4 && !S.drawn[k]);
    if(t!==undefined){ alexanderDraw(0,+t); log(`🏀 你发动了【造犯规】`,true); enableHumanTurn(); return; } }
  if(st==='lebron' && !S.lebronUsed && prev && prev.type==='single' && G.passes>=1){
    G.players[0].hand=G.players[0].hand.concat([prev.cards[0]]); G.lastMove=null; G.passes=0; S.lebronUsed=true;
    log(`👑 ${G.players[0].name}·加冕：截下 ${LABEL[prev.cards[0].v]} 并领出`,true);
    const a2=genAllForSeat(0); const m2=strongPick(0,a2,null); if(m2) commitMove(0,m2); else applyMove(0,null); return; }
  if(st==='jokic' && !S.jokicUsed && hand.length>1){ jokicSwap(0); log(`🏀 你发动了【移花接木】`,true); enableHumanTurn(); return; }
  log('🏀 当前没有可用的主动技能',true); renderHumanControls();
}

      const note=document.createElement("div"); note.className="skillNote"; note.textContent=`${tag}【${STARS[st].skill}】·自动触发`;

function onPlay(){
  if(G.skillMode==="curry"){
    const mv=buildReorgMove([...selected]);
    if(!mv){alert("三分雨：请选择一对（或一对+单/对）作为三连");return;}
    if(G.lastMove && !beats(G.lastMove,mv)){alert("三连管不上上家");return;}
    G.skillUsed=true; G.skillMode=null; clearTimers();
    const real=[...selected]; selected.clear();
    log(`🏀 库里·三分雨：重组三连 ${moveName(mv)}`,true);
    commitMove(0,mv);
    return;
  }
  const cards=[...selected].map(id=>G.players[0].hand.find(x=>x.id==id));
  const wid=(G.ss[0]&&G.ss[0].wildIds)?G.ss[0].wildIds:[];
  const selWilds=cards.filter(c=>wid.includes(c.id));
  let mv;
  if(selWilds.length){
    const wildMap={};
    for(const w of selWilds){
      if(G.wildChoice[w.id]===undefined){ alert("请先为万能牌选择要代表的点数（下方金色按钮）"); return; }
      wildMap[w.id]=G.wildChoice[w.id];
    }
    mv=parseMoveWithWild(cards,wildMap);
  } else {
    mv=parseMove(cards);
  }
  if(!mv){alert("牌型不合法");return;}
  if(!beats(G.lastMove,mv)){alert("管不上上家");return;}
  clearTimers(); selected.clear(); G.wildChoice={}; applyMove(0,mv);
}
function buildReorgMove(ids){
  if(ids.length<2) return null;
  const cards=ids.map(id=>G.players[0].hand.find(x=>x.id==id));
  if(cards.some(c=>!c)) return null;
  const g={}; cards.forEach(c=>(g[c.v]=g[c.v]||[]).push(c));
  const ranks=Object.keys(g).map(Number);
  if(ids.length===2 && ranks.length===1){
    const r=ranks[0];
    return {type:"triple",rank:r,len:1,_phantom:true,cards:[g[r][0],g[r][1],mkPhantom(r)]};
  }
  if(ids.length===3){
    const pr=ranks.find(r=>g[r].length===2), sr=ranks.find(r=>g[r].length===1);
    if(pr!==undefined&&sr!==undefined&&pr!==sr)
      return {type:"triple1",rank:pr,len:1,_phantom:true,cards:[g[pr][0],g[pr][1],mkPhantom(pr),g[sr][0]]};
  }
  if(ids.length===4){
    const pr=ranks.find(r=>g[r].length===2);
    if(ranks.length===2 && pr!==undefined){
      const or=ranks.find(r=>r!==pr);
      return {type:"triple2",rank:pr,len:1,_phantom:true,cards:[g[pr][0],g[pr][1],mkPhantom(pr),g[or][0],g[or][1]]};
    }
  }
  return null;
}
function mkPhantom(v){ return {id:"PH"+(++CARD_SEQ),v,s:"",red:false,label:LABEL[v],phantom:true}; }

function startCountdown(seconds, onTimeout){

  G.timerId=setInterval(()=>{

    if(G.timer<=0){ clearInterval(G.timerId); G.timerId=null; if(onTimeout) onTimeout(); }

function startClock(){
  if(G.clockId) return;            // 整局只启动一次，避免被 nextTurn 的 clearTimers 反复重置
  G.elapsed=0; updateClock();
  G.clockId=setInterval(()=>{
    G.elapsed++; updateClock();
    if(G.elapsed===SOFT_CAP) log("⏱ 本局已达软上限 8 分钟，建议加快节奏（不强制结束）");
  },1000);
}

/* ============ Phase 6 计时遥测（localStorage 捕获，部署后真实数据自动累积） ============ */
const TELE_KEY="nba_poker_telemetry_v1", TELE_CAP=200;
function loadTelemetry(){ try{ return JSON.parse(localStorage.getItem(TELE_KEY)||"[]"); }catch(e){ return []; } }
function saveTelemetry(rec){ try{ const a=loadTelemetry(); a.push(rec); if(a.length>TELE_CAP) a.splice(0,a.length-TELE_CAP); localStorage.setItem(TELE_KEY, JSON.stringify(a)); }catch(e){} }
function recordTelemetry(rec){ saveTelemetry(rec); }
function fmtDur(s){ const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
function showTelemetry(){
  const t=document.getElementById("tele"); t.classList.toggle("on");
  if(!t.classList.contains("on")) return;
  const a=loadTelemetry();
  document.getElementById("tN").textContent=a.length;
  if(!a.length) return;
  const dur=a.map(r=>r.elapsed);
  const avg=dur.reduce((x,y)=>x+y,0)/dur.length;
  const med=dur.slice().sort((x,y)=>x-y)[Math.floor(dur.length/2)];
  const max=dur.reduce((x,y)=>Math.max(x,y),0);
  const hAvg=a.reduce((x,r)=>x+r.humanTurns,0)/a.length;
  const aAvg=a.reduce((x,r)=>x+r.aiTurns,0)/a.length;
  document.getElementById("tAvg").textContent=fmtDur(Math.round(avg));
  document.getElementById("tMed").textContent=fmtDur(Math.round(med));
  document.getElementById("tMax").textContent=fmtDur(max);
  document.getElementById("tHuman").textContent=hAvg.toFixed(1);
  document.getElementById("tAi").textContent=aAvg.toFixed(1);
  document.getElementById("tJson").value=JSON.stringify(a,null,2);
}
function copyTelemetry(){
  const ta=document.getElementById("tJson");
  if(!ta.value){ alert("暂无遥测数据，先玩几局再复制。"); return; }
  ta.focus(); ta.select();
  try{ document.execCommand("copy"); alert("已复制 "+loadTelemetry().length+" 局遥测 JSON，直接粘贴给我即可。"); }
  catch(e){ alert("复制失败，请手动 Ctrl/⌘+C 复制文本框内容。"); }
}
function exportTelemetry(){
  const a=loadTelemetry(); const blob=new Blob([JSON.stringify(a,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const fn=document.createElement("a");
  fn.href=url; fn.download="nba_poker_telemetry_"+Date.now()+".json"; fn.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearTelemetry(){ try{ localStorage.removeItem(TELE_KEY); }catch(e){} showTelemetry(); }

/* ============ 绑定 ============ */
document.getElementById("minBtn").onclick=()=>{
  const o=document.getElementById("overlay");
  document.getElementById("ovTitle").textContent="最小化";
  document.getElementById("ovHl").style.display="none";
  document.getElementById("ovSub").textContent="已回到比赛画面 · 点此回到游戏";
  o.classList.add("on");
};
document.getElementById("teleBtn").onclick=showTelemetry;
document.getElementById("tCopy").onclick=copyTelemetry;
document.getElementById("tExport").onclick=exportTelemetry;
document.getElementById("tClear").onclick=clearTelemetry;
document.getElementById("overlay").onclick=()=>{
  if(G.phase==="over"){document.getElementById("overlay").classList.remove("on");newGame();}
  else document.getElementById("overlay").classList.remove("on");
};
window.addEventListener("DOMContentLoaded",()=>{ newGame(); });
</script>
